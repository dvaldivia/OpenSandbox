name: Publish Example Images (GHCR)

run-name: "Publish example image(s) ${{ inputs.image }}:${{ inputs.tag }} to GHCR"

# Builds the example sandbox images (chrome, desktop, playwright, vscode)
# multi-arch (linux/amd64 + linux/arm64) and publishes them to
# ghcr.io/<owner>/<image>:<tag>.
#
# Manual / on-demand only: the example images have no release-tag convention, so
# this workflow is triggered by hand via the Actions "Run workflow" button.
# Core component images are released by publish-images-ghcr.yml.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Example image to build'
        required: true
        type: choice
        options:
          - all
          - chrome
          - desktop
          - playwright
          - vscode
        default: all
      tag:
        description: 'Image tag to publish'
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.image }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build image matrix
        id: set
        run: |
          set -euo pipefail
          if [ "${{ inputs.image }}" = "all" ]; then
            echo 'matrix={"image":["chrome","desktop","playwright","vscode"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"image":["${{ inputs.image }}"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: examples/${{ matrix.image }}
          file: examples/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
