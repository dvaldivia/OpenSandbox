name: Publish Images (GHCR)

# Builds every core OpenSandbox container image multi-arch (linux/amd64 + linux/arm64)
# and publishes them to the GitHub Container Registry under ghcr.io/<owner>/<image>.
#
# Images built here: server, execd, ingress, egress, code-interpreter,
# controller, task-executor, image-committer.
# Example sandbox images live in publish-example-images-ghcr.yml.

on:
  push:
    branches: [main]
  # TEMPORARY: also build + push on PRs to main so we can validate the workflow
  # end-to-end. Once validated, delete this `pull_request:` block to build + push
  # on main only.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: server
            dockerfile: server/Dockerfile
          - image: execd
            context: .
            dockerfile: components/execd/Dockerfile
          - image: ingress
            context: .
            dockerfile: components/ingress/Dockerfile
          - image: egress
            context: .
            dockerfile: components/egress/Dockerfile
          - image: code-interpreter
            context: sandboxes/code-interpreter
            dockerfile: sandboxes/code-interpreter/Dockerfile
          - image: controller
            context: kubernetes
            dockerfile: kubernetes/Dockerfile
            build-args: |
              PACKAGE=./cmd/controller
          - image: task-executor
            context: kubernetes
            dockerfile: kubernetes/Dockerfile
            build-args: |
              PACKAGE=cmd/task-executor/main.go
              USERID=0
          - image: image-committer
            context: kubernetes
            dockerfile: kubernetes/Dockerfile.image-committer
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build metadata
        id: bmeta
        run: |
          {
            echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit_short=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.bmeta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.bmeta.outputs.build_time }}
            COMMIT_ID=${{ steps.bmeta.outputs.commit_short }}
            BUILD_DATE=${{ steps.bmeta.outputs.build_time }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
