name: Publish Images (GHCR)

run-name: >-
  Publish ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.component, inputs.version) || github.ref_name }} to GHCR

# Builds a single OpenSandbox core component image multi-arch (linux/amd64 +
# linux/arm64) and publishes it to ghcr.io/<owner>/<component>:<version> (plus
# :latest) when a component release tag is pushed.
#
# Triggers on the same per-component release tags already consumed by
# publish-server.yml / publish-components.yml (which push to DockerHub + ACR), so
# GHCR becomes a parallel mirror with no new tagging conventions:
#   server/v*               -> server
#   docker/<component>/v*    -> execd | code-interpreter | ingress | egress
#   k8s/<component>/v*       -> controller | task-executor | image-committer
#
# Example sandbox images are built on demand by publish-example-images-ghcr.yml.

on:
  push:
    tags:
      - 'server/v*'
      - 'docker/execd/v*'
      - 'docker/code-interpreter/v*'
      - 'docker/ingress/v*'
      - 'docker/egress/v*'
      - 'k8s/controller/v*'
      - 'k8s/task-executor/v*'
      - 'k8s/image-committer/v*'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to build'
        required: true
        type: choice
        options:
          - server
          - execd
          - code-interpreter
          - ingress
          - egress
          - controller
          - task-executor
          - image-committer
      version:
        description: 'Image tag to publish (e.g. v1.2.3)'
        required: true
        default: latest
      ref:
        description: 'Git ref to build from (defaults to the triggering ref; set to the release tag for a faithful rebuild)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # On a release-tag push this is empty -> falls back to the tag ref.
          # On workflow_dispatch, pass the release tag (e.g. docker/execd/v1.0.16)
          # to faithfully rebuild that release instead of the default branch.
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve component and build config
        id: cfg
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            COMPONENT="${{ inputs.component }}"
            VERSION="${{ inputs.version }}"
          else
            TAG_PATH="${GITHUB_REF#refs/tags/}"
            case "$TAG_PATH" in
              server/*)
                COMPONENT="server"
                VERSION="${TAG_PATH#server/}"
                ;;
              docker/*)
                rest="${TAG_PATH#docker/}"
                COMPONENT="${rest%%/*}"
                VERSION="${rest#*/}"
                ;;
              k8s/*)
                rest="${TAG_PATH#k8s/}"
                COMPONENT="${rest%%/*}"
                VERSION="${rest#*/}"
                ;;
              *)
                echo "::error::Unrecognized release tag: ${TAG_PATH}"
                exit 1
                ;;
            esac
          fi

          if [ -z "${COMPONENT}" ] || [ -z "${VERSION}" ]; then
            echo "::error::Could not resolve component/version (component='${COMPONENT}' version='${VERSION}')"
            exit 1
          fi

          GIT_COMMIT="$(git rev-parse HEAD)"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          case "$COMPONENT" in
            server)
              CONTEXT="server"
              DOCKERFILE="server/Dockerfile"
              ;;
            execd)
              CONTEXT="."
              DOCKERFILE="components/execd/Dockerfile"
              ;;
            ingress)
              CONTEXT="."
              DOCKERFILE="components/ingress/Dockerfile"
              ;;
            egress)
              CONTEXT="."
              DOCKERFILE="components/egress/Dockerfile"
              ;;
            code-interpreter)
              CONTEXT="sandboxes/code-interpreter"
              DOCKERFILE="sandboxes/code-interpreter/Dockerfile"
              ;;
            controller)
              CONTEXT="kubernetes"
              DOCKERFILE="kubernetes/Dockerfile"
              ;;
            task-executor)
              CONTEXT="kubernetes"
              DOCKERFILE="kubernetes/Dockerfile"
              ;;
            image-committer)
              CONTEXT="kubernetes"
              DOCKERFILE="kubernetes/Dockerfile.image-committer"
              ;;
            *)
              echo "::error::Unknown component: ${COMPONENT}"
              exit 1
              ;;
          esac

          {
            echo "component=${COMPONENT}"
            echo "version=${VERSION}"
            echo "context=${CONTEXT}"
            echo "dockerfile=${DOCKERFILE}"
            echo "build_args<<__ARGS_EOF__"
            case "$COMPONENT" in
              execd|ingress|egress)
                echo "VERSION=${VERSION}"
                echo "GIT_COMMIT=${GIT_COMMIT}"
                echo "BUILD_TIME=${BUILD_TIME}"
                ;;
              controller)
                echo "PACKAGE=./cmd/controller"
                echo "COMMIT_ID=${COMMIT_ID}"
                echo "BUILD_DATE=${BUILD_TIME}"
                ;;
              task-executor)
                echo "PACKAGE=cmd/task-executor/main.go"
                echo "USERID=0"
                echo "COMMIT_ID=${COMMIT_ID}"
                echo "BUILD_DATE=${BUILD_TIME}"
                ;;
            esac
            echo "__ARGS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.cfg.outputs.component }}
          tags: |
            type=raw,value=${{ steps.cfg.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.cfg.outputs.build_args }}
          cache-from: type=gha,scope=${{ steps.cfg.outputs.component }}
          cache-to: type=gha,mode=max,scope=${{ steps.cfg.outputs.component }}
